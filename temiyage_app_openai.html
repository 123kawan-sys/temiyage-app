<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="手土産アプリ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>手土産アプリ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f5f5f7; color: #1c1c1e; max-width: 480px; margin: 0 auto; min-height: 100vh; }
.nav { display: flex; background: #fff; border-bottom: 1px solid #e5e5ea; position: sticky; top: 0; z-index: 100; }
.nav-btn { flex: 1; padding: 12px 4px 10px; font-size: 11px; font-weight: 600; border: none; background: none; color: #8e8e93; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.nav-btn.active { color: #1c1c1e; border-bottom-color: #1c1c1e; }
.page { display: none; padding: 16px; }
.page.active { display: block; }
.section { margin-bottom: 18px; }
.lbl { font-size: 11px; font-weight: 600; color: #8e8e93; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { font-size: 13px; padding: 6px 13px; border-radius: 20px; border: 1px solid #d1d1d6; color: #8e8e93; background: #fff; cursor: pointer; transition: all 0.12s; user-select: none; }
.chip.on { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
.tab-row { display: flex; gap: 6px; margin-bottom: 10px; }
.tab { font-size: 13px; font-weight: 600; padding: 6px 18px; border-radius: 20px; border: 1px solid #d1d1d6; color: #8e8e93; cursor: pointer; }
.tab.on { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
input[type=text], input[type=date], input[type=number], select, textarea { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d1d6; background: #fff; color: #1c1c1e; -webkit-appearance: none; appearance: none; }
input[type=date] { cursor: pointer; }
.delivery-box { background: #f2f2f7; border-radius: 12px; padding: 12px; margin-top: 8px; }
.go-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 14px; border: none; background: #1c1c1e; color: #fff; cursor: pointer; margin-top: 4px; transition: opacity 0.15s; }
.go-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.divider { border: none; border-top: 1px solid #e5e5ea; margin: 6px 0 16px; }
.loading { text-align: center; padding: 40px 20px; color: #8e8e93; font-size: 14px; }
.spinner { width: 28px; height: 28px; border: 2px solid #e5e5ea; border-top-color: #1c1c1e; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: #fff0f0; border-radius: 12px; padding: 14px; text-align: center; font-size: 13px; color: #c0392b; }
.result-header { font-size: 13px; font-weight: 600; color: #8e8e93; margin-bottom: 12px; }
.gift-card { background: #fff; border-radius: 16px; border: 1px solid #e5e5ea; overflow: hidden; margin-bottom: 12px; transition: transform 0.1s; }
.gift-card:active { transform: scale(0.98); }
.gift-img-wrap { width: 100%; height: 140px; background: #f2f2f7; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8e8e93; overflow: hidden; cursor: pointer; }
.gift-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.gift-body { padding: 12px 14px; cursor: pointer; }
.gift-name { font-size: 14px; font-weight: 700; color: #1c1c1e; margin-bottom: 3px; }
.gift-shop { font-size: 12px; color: #8e8e93; margin-bottom: 6px; }
.gift-foot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.gift-price { font-size: 15px; font-weight: 700; color: #1c1c1e; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #e8f4fd; color: #1a73e8; }
.badge-warn { background: #fff3cd; color: #856404; }
.badge-danger { background: #fde8e8; color: #c0392b; }
.badge-season { background: #e8f5e9; color: #2e7d32; }
.gift-reason { font-size: 12px; color: #8e8e93; margin-top: 6px; line-height: 1.5; }
.expiry-alert { font-size: 11px; color: #c0392b; margin-top: 4px; }
.gift-actions { display: flex; justify-content: flex-end; padding: 0 14px 12px; }
.keep-btn { font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 20px; border: 1.5px solid #d1d1d6; background: #fff; color: #8e8e93; cursor: pointer; transition: all 0.15s; }
.keep-btn.kept { background: #fff3cd; color: #856404; border-color: #f0c040; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 16px; }
.modal-handle { width: 36px; height: 4px; background: #d1d1d6; border-radius: 2px; margin: 0 auto 14px; }
.modal-img-wrap { width: 100%; height: 180px; background: #f2f2f7; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8e8e93; overflow: hidden; margin-bottom: 14px; }
.modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.modal-name { font-size: 18px; font-weight: 700; color: #1c1c1e; margin-bottom: 2px; }
.modal-shop { font-size: 13px; color: #8e8e93; margin-bottom: 12px; }
.modal-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f2f7; font-size: 13px; }
.modal-lbl { color: #8e8e93; }
.modal-val { color: #1c1c1e; font-weight: 600; text-align: right; max-width: 60%; line-height: 1.5; }
.modal-val.warn { color: #856404; }
.modal-val.danger { color: #c0392b; }
.order-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 14px; border: none; background: #1c1c1e; color: #fff; cursor: pointer; margin-top: 14px; }
.modal-close { width: 100%; padding: 12px; font-size: 14px; border-radius: 14px; border: 1px solid #d1d1d6; background: none; color: #8e8e93; cursor: pointer; margin-top: 8px; }
.order-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-end; justify-content: center; }
.order-overlay.open { display: flex; }
.order-sheet { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 16px; }
.order-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.order-sub { font-size: 13px; color: #8e8e93; margin-bottom: 14px; }
.order-summary { background: #f2f2f7; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: #8e8e93; line-height: 2.1; }
.order-summary span { color: #1c1c1e; font-weight: 600; }
.send-execute { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 14px; border: none; background: #1c1c1e; color: #fff; cursor: pointer; }
.sent-wrap { text-align: center; padding: 30px 16px; }
.sent-icon { width: 56px; height: 56px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 26px; }
.search-box-wrap { position: relative; margin-bottom: 10px; }
.search-box { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 12px; border: 1px solid #d1d1d6; background: #f2f2f7; color: #1c1c1e; }
.filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; flex-wrap: nowrap; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #d1d1d6; color: #8e8e93; background: #fff; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.filter-chip.on { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
.h-item { display: flex; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #f2f2f7; }
.h-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.h-date { font-size: 11px; color: #8e8e93; min-width: 40px; padding-top: 2px; }
.h-body { flex: 1; }
.h-name { font-size: 13px; font-weight: 700; color: #1c1c1e; margin-bottom: 2px; }
.h-detail { font-size: 11px; color: #8e8e93; line-height: 1.5; margin-bottom: 3px; }
.h-shop-link { font-size: 11px; color: #1a73e8; text-decoration: underline; cursor: pointer; display: inline-block; margin-bottom: 3px; }
.h-footer { display: flex; justify-content: space-between; align-items: center; }
.h-person { font-size: 11px; color: #8e8e93; }
.no-result { text-align: center; padding: 40px 0; font-size: 14px; color: #8e8e93; }
.qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qty-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #d1d1d6; background: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.qty-num { font-size: 20px; font-weight: 700; min-width: 32px; text-align: center; }
.departure-box { background: #f2f2f7; border-radius: 12px; padding: 12px; margin-top: 8px; }
/* モード選択 */
.mode-select-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
.mode-btn { flex: 1; padding: 20px 10px 16px; border-radius: 18px; border: 1.5px solid #e5e5ea; background: #fff; cursor: pointer; text-align: center; transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.mode-btn:active { transform: scale(0.97); }
.mode-btn .mode-label { font-size: 14px; font-weight: 700; color: #1c1c1e; margin-top: 10px; line-height: 1.5; }
.mode-btn .mode-desc { font-size: 11px; color: #8e8e93; margin-top: 4px; line-height: 1.6; }
/* お店から選ぶ */
.store-search-input { width: 100%; font-size: 15px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #d1d1d6; background: #fff; color: #1c1c1e; outline: none; -webkit-appearance: none; }
.store-search-input:focus { border-color: #1c1c1e; }
.store-suggestions { background: #fff; border-radius: 12px; border: 1px solid #e5e5ea; overflow: hidden; margin-top: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.store-suggestion-item { padding: 12px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f2f2f7; display: flex; flex-direction: column; gap: 2px; }
.store-suggestion-item:last-child { border-bottom: none; }
.store-suggestion-item:active { background: #f2f2f7; }
.store-suggestion-name { font-weight: 600; color: #1c1c1e; }
.store-suggestion-loc { font-size: 11px; color: #8e8e93; }
.store-selected-badge { display: flex; align-items: center; justify-content: space-between; background: #1c1c1e; color: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.store-selected-name { font-size: 14px; font-weight: 700; }
.store-clear-btn { font-size: 20px; opacity: 0.6; cursor: pointer; background: none; border: none; color: #fff; padding: 0 0 0 10px; }
.store-products-header { font-size: 13px; font-weight: 600; color: #8e8e93; margin-bottom: 10px; }
.back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8e8e93; cursor: pointer; margin-bottom: 14px; border: none; background: none; padding: 0; }
.order-form-section { margin-bottom: 14px; }
.order-form-label { font-size: 11px; font-weight: 600; color: #8e8e93; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
</style>
</head>
<body>

<div style="background:#1c1c1e;padding:12px 16px 10px;text-align:center">
  <span style="color:#fff;font-size:16px;font-weight:700;letter-spacing:0.05em">手土産アプリ</span>
</div>
<div class="nav">
  <button class="nav-btn active" onclick="showPage('search')">候補検索</button>
  <button class="nav-btn" onclick="showPage('history')">履歴</button>
</div>

<div id="page-search" class="page active">
  <div id="mode-select-area">
    <div style="font-size:13px;color:#8e8e93;margin-bottom:12px;text-align:center">どちらで探しますか？</div>
    <div class="mode-select-wrap">
      <div class="mode-btn" onclick="selectMode('ai')">
        <img src="icon_ai.png" style="width:80px;height:80px;object-fit:contain;display:block;margin:0 auto">
        <div class="mode-label">AIにおすすめ<br>を聞く</div>
        <div class="mode-desc">条件を入力して<br>AIが最適候補を提案</div>
      </div>
      <div class="mode-btn" onclick="selectMode('store')">
        <img src="icon_store.png" style="width:80px;height:80px;object-fit:contain;display:block;margin:0 auto">
        <div class="mode-label">お店から<br>選ぶ</div>
        <div class="mode-desc">店舗を選んで<br>商品を指定</div>
      </div>
    </div>
  </div>

  <!-- AI検索フォーム -->
  <div id="ai-search-area" style="display:none">
    <button class="back-btn" onclick="resetMode()">← 選び直す</button>
    <div class="section">
      <div class="lbl">発注者</div>
      <div class="tab-row" id="dept-tabs"></div>
      <div class="chips" id="member-chips"></div>
    </div>
    <hr class="divider">
    <div class="section">
      <div class="lbl">訪問目的（複数選択可）</div>
      <div class="chips" id="purpose-chips"></div>
    </div>
    <div class="section">
      <div class="lbl">雰囲気・こだわり（複数選択可）</div>
      <div class="chips" id="vibe-chips"></div>
    </div>
    <hr class="divider">
    <div class="section">
      <div class="lbl">渡す日・出発時間</div>
      <input type="date" id="date-input" onchange="setDate(this.value)" style="margin-bottom:8px">
      <select id="departure-time" style="width:100%">
        <option value="">出発時間（任意）</option>
        <option>8:00</option><option>8:30</option>
        <option>9:00</option><option>9:30</option>
        <option>10:00</option><option>10:30</option>
        <option>11:00</option><option>11:30</option>
        <option>12:00</option><option>12:30</option>
        <option>13:00</option><option>13:30</option>
        <option>14:00</option><option>14:30</option>
        <option>15:00</option><option>15:30</option>
        <option>16:00</option><option>16:30</option>
        <option>17:00</option><option>17:30</option>
        <option>18:00</option><option>18:30</option>
        <option>19:00</option><option>19:30</option>
        <option>20:00</option>
      </select>
      <div id="date-clear-wrap" style="display:none;text-align:right;margin-top:4px">
        <span style="font-size:12px;color:#8e8e93;cursor:pointer" onclick="clearDate()">× クリア</span>
      </div>
    </div>
    <div class="section">
      <div class="lbl">予算レンジ</div>
      <div class="chips" id="budget-chips"></div>
    </div>
    <div class="section">
      <div class="lbl">持参 or 配送</div>
      <div class="chips" id="delivery-chips"></div>
      <div id="delivery-box" style="display:none">
        <div class="delivery-box">
          <div class="lbl">送り先</div>
          <div class="chips" id="delivery-to-chips"></div>
          <input type="text" id="delivery-addr" placeholder="住所を入力（任意）" style="margin-top:8px">
        </div>
      </div>
    </div>
    <button class="go-btn" id="go-btn" disabled onclick="generateCandidates()">条件をすべて選んでください</button>
    <div id="result-area" style="margin-top:20px"></div>
  </div>

  <!-- お店から選ぶフロー -->
  <div id="store-search-area" style="display:none">
    <button class="back-btn" onclick="resetMode()">← 選び直す</button>
    <div id="store-step1">
      <div class="section">
        <div class="lbl">店舗名を入力</div>
        <input type="text" class="store-search-input" id="store-search-input"
          placeholder="店名をひらがな・カタカナ・英字で…"
          oninput="onStoreSearchInput(this.value)" autocomplete="off">
        <div id="store-suggestions-wrap" style="display:none;margin-top:4px">
          <div class="store-suggestions" id="store-suggestions-list"></div>
        </div>
        <div id="store-no-result" style="display:none;font-size:13px;color:#8e8e93;padding:10px 0">該当する店舗が見つかりません</div>
      </div>
    </div>
    <div id="store-step2" style="display:none">
      <div id="store-selected-badge-wrap"></div>
      <div class="store-products-header" id="store-products-header"></div>
      <div id="store-products-list"></div>
    </div>
    <div id="store-step3" style="display:none">
      <button class="back-btn" onclick="backToProducts()">← 商品を選び直す</button>
      <div id="store-order-selected-product" style="margin-bottom:14px"></div>
      <div class="order-form-section">
        <div class="order-form-label">発注者</div>
        <div class="tab-row" id="store-dept-tabs"></div>
        <div class="chips" id="store-member-chips"></div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">お渡し先の会社名</div>
        <input type="text" id="store-order-company" placeholder="例：丸紅不動産"
          oninput="S.storeOrderCompany=this.value;updateStoreOrderBtn();updateStoreCompanyList()"
          style="margin-bottom:6px">
        <div id="store-company-suggestions-wrap" style="display:none;margin-bottom:8px">
          <div style="display:flex;flex-direction:column;gap:3px" id="store-company-suggestions"></div>
        </div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">訪問目的（複数選択可）</div>
        <div class="chips" id="store-purpose-chips"></div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">渡す日</div>
        <input type="date" id="store-date-input" onchange="setStoreDate(this.value)" style="margin-bottom:4px">
        <div id="store-date-clear-wrap" style="display:none;text-align:right">
          <span style="font-size:12px;color:#8e8e93;cursor:pointer" onclick="clearStoreDate()">× クリア</span>
        </div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">個数</div>
        <div class="qty-row">
          <button class="qty-btn" onclick="changeStoreQty(-1)">−</button>
          <span class="qty-num" id="store-qty-display">1</span>
          <button class="qty-btn" onclick="changeStoreQty(1)">＋</button>
          <span style="font-size:13px;color:#8e8e93">個</span>
        </div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">持参 or 配送</div>
        <div class="chips" id="store-delivery-chips"></div>
        <div id="store-delivery-box" style="display:none">
          <div class="delivery-box">
            <div class="lbl">送り先</div>
            <div class="chips" id="store-delivery-to-chips"></div>
          </div>
        </div>
      </div>
      <button class="go-btn" id="store-order-btn" disabled onclick="sendStoreOrder()" style="margin-top:8px">発注し履歴に記録する ↗</button>
      <div id="store-order-result" style="margin-top:16px"></div>
    </div>
  </div>
</div>

<div id="page-history" class="page">
  <div class="search-box-wrap">
    <input type="text" class="search-box" id="history-search" placeholder="🔍 社名・支店名・商品名・担当者で検索" oninput="renderHistory()">
  </div>
  <div class="filter-row" id="history-filters"></div>
  <div id="history-content"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>
<div class="order-overlay" id="order-overlay" onclick="closeOrder(event)">
  <div class="order-sheet" id="order-content"></div>
</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxcEXLzjVzCymWNmBHxSsDPHBeloFqVpZMeQQwKe69YeBO5mkWiB4Mata5p_ppHvaZofQ/exec';
const DEPTS = {
  'BR': ['社長','久積','河埜','宮原','廣野','佐藤','牧田','窪田','久保'],
  'PM': ['小島','森崎','中村聖','鳥海','矢島','奥村','宮園','下田','栗林','村田','空閑','中村美','萩原','西山','池田','藤田'],
};
const STORE_READINGS = {
  'ASAKOIWAYANAGI': ['あさこいわやなぎ','アサコイワヤナギ','asako'],
  'DIVA': ['でぃーば','ディーバ','diva'],
  '季のせ': ['きのせ','キノセ','kinose'],
  'オーフィルドゥジュ': ['おーふぃるどぅじゅ','オーフィルドゥジュ','aufildujeu'],
  'エノテカ/岩田屋': ['えのてか','エノテカ','enoteca','いわたや'],

async function loadGiftsFromSheets() {
  try {
    const res = await fetch(SHEETS_URL, { redirect: 'follow' });
    const data = await res.json();
    try {
      const hres = await fetch(SHEETS_URL + '?sheet=履歴', { redirect: 'follow' });
      const hdata = await hres.json();
      if (Array.isArray(hdata)) {
        S.historyData = hdata.map(r => ({
          company: r['お渡し先'] || '',
          date: formatDate(r['日付'] || r['渡す日']),
          rawDate: r['日付'] || r['渡す日'] || '',
          name: r['商品名'] || '',
          shop: r['店舗名'] || '',
          loc: r['購入場所'] || '',
          detail: (r['店舗名']||'') + '｜' + (r['内容']||'') + '｜¥' + (r['価格']||''),
          person: r['発注者'] || '',
          purpose: r['目的'] || '',
          delivery: r['持参配送'] === '配送',
        })).filter(r => r.company);
        S.historyData.sort((a,b) => new Date(b.rawDate||0) - new Date(a.rawDate||0));
      }
    } catch(e2) {}
    if (Array.isArray(data) && data.length > 0) {
      S.gifts = data.map((row,i) => ({
        id: row['ID'] || i+1,
        name: row['商品名'] || '',
        shop: row['店舗名'] || '',
        loc: row['購入場所'] || '',
        cat: row['カテゴリ'] || '',
        price: row['価格（税込）'] ? Number(row['価格（税込）']) : null,
        detail: row['内容・個数'] || '',
        // 訪問目的チェックボックス
        purposeVisit:  row['訪問']===true||row['訪問']==='TRUE',
        purposeOreire: row['御礼']===true||row['御礼']==='TRUE',
        purposeSyazai: row['謝罪']===true||row['謝罪']==='TRUE',
        purposeKaisyoku: row['会食']===true||row['会食']==='TRUE',
        // 雰囲気タグ
        vibeTaisu:   row['大人数']===true||row['大人数']==='TRUE',
        vibeSenior:  row['シニア']===true||row['シニア']==='TRUE',
        vibeKoukyuu: row['高級感']===true||row['高級感']==='TRUE',
        vibeFukuoka: row['福岡銘菓']===true||row['福岡銘菓']==='TRUE',
        vibeGohan:   row['ごはんのおとも']===true||row['ごはんのおとも']==='TRUE',
        vibeKarui:   row['軽い']===true||row['軽い']==='TRUE',
        vibeShioaji: row['塩味']===true||row['塩味']==='TRUE',
        note: row['備考'] || '',
        cold: row['要冷蔵']==='〇'||row['要冷蔵']==='要冷蔵'||row['要冷蔵']===true,
        season: row['季節限定'] || null,
        expiry: row['賞味期限（日数）'] ? Number(row['賞味期限（日数）']) : null,
        photo1: row['写真URL'] || null,
      })).filter(g => g.name);
    }
  } catch(e) { console.log('シート読み込みエラー:', e); }
}

function formatDate(d) {
  if (!d) return '';
  if (d instanceof Date) return (d.getMonth()+1)+'/'+d.getDate();
  var s = String(d);
  if (s.includes('T')) { var dt=new Date(s); return (dt.getMonth()+1)+'/'+dt.getDate(); }
  return s;
}
function isUrl(s) { return s && (s.startsWith('http://')||s.startsWith('https://')); }

// ===== AI候補生成 =====
async function generateCandidates(){
  const resultArea=document.getElementById('result-area');
  const btn=document.getElementById('go-btn');
  btn.disabled=true; btn.textContent='生成中...';
  resultArea.innerHTML='<div class="loading"><div class="spinner"></div>AIが候補を選定しています...</div>';

  // キープ済みの商品を取得
  const keptGifts = S.gifts.filter(g => S.keptIds.has(g.id));

  const params={
    person:S.person, dept:S.dept, purposes:S.purposes, vibes:S.vibes,
    date:S.date, budgetLabel:S.budgetLabel,
    budgetMin:S.budgetMin, budgetMax:S.budgetMax,
    delivery:S.delivery, deliveryTo:S.deliveryTo,
    keptIds: [...S.keptIds],
    randomSeed: Math.random(), // ランダム性のため
  };

  try {
    const res=await fetch(SHEETS_URL+'?action=ai&params='+encodeURIComponent(JSON.stringify(params)),{redirect:'follow'});
    const text=await res.text();
    const data=JSON.parse(text);
    if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
    if(!data.choices||!data.choices[0])throw new Error('AIからの応答が不正です。もう一度お試しください。');
    const content=data.choices[0].message.content;
    const picks=JSON.parse(content.replace(/```json|```/g,'').trim());

    // vibeカラムのマッピング
    const vibeKeyMap = {
      '大人数': 'vibeTaisu', 'シニア': 'vibeSenior', '高級感': 'vibeKoukyuu',
      '福岡銘菓': 'vibeFukuoka', 'ごはんのおとも': 'vibeGohan',
      '軽い': 'vibeKarui', '塩味': 'vibeShioaji'
    };

    // AIの候補をマッピング（キープ除外）
    let newResults = picks.map(p=>({...S.gifts.find(g=>g.id==p.id),reason:p.reason,tag:p.tag})).filter(g=>g&&!S.keptIds.has(g.id));

    // vibesが選択されている場合、フロント側でもフィルタリング
    if(S.vibes.length > 0) {
      const vibeFiltered = newResults.filter(g => S.vibes.some(v => g[vibeKeyMap[v]]));
      // フィルター後に結果がある場合のみ適用
      if(vibeFiltered.length >= 2) newResults = vibeFiltered;
    }

    // キープ済み＋新候補を合わせて表示
    renderResults([...keptGifts.map(g=>({...g,kept:true})), ...newResults]);
  } catch(e){
    resultArea.innerHTML=`<div class="error-box">エラー：${e.message||'生成に失敗しました'}</div>`;
  }
  btn.disabled=false; btn.textContent=`${S.person}さんの候補を生成 ↗`;
}

function toggleKeep(id){
  if(S.keptIds.has(id)) S.keptIds.delete(id);
  else S.keptIds.add(id);
  // 現在表示中のカードだけ更新
  const resultArea=document.getElementById('result-area');
  const currentGifts=S.gifts.filter(g=>resultArea.innerHTML.includes(`"id":${g.id},`)||resultArea.innerHTML.includes(`id=${g.id}`));
  // 全体再描画
  const allShownIds=[...resultArea.querySelectorAll('.keep-btn')].map(b=>{
    const card=b.closest('.gift-card');
    const onclick=b.getAttribute('onclick');
    const m=onclick.match(/toggleKeep\((\d+)\)/);
    return m?Number(m[1]):null;
  }).filter(Boolean);
  const shownGifts=allShownIds.map(id=>S.gifts.find(g=>g.id===id)).filter(Boolean);
  // reasonとtagを保持するため既存の表示から取得
  const header=resultArea.querySelector('.result-header');
  renderResults(shownGifts.map(g=>({
    ...g,
    reason: (() => { try { const el=resultArea.querySelector(`.gift-reason`); return ''; } catch(e){ return ''; } })(),
  })));
  // 再検索ボタンのテキスト更新
  const btn=document.getElementById('go-btn');
  if(S.person&&S.purposes.length>0){
    btn.disabled=false;
    btn.textContent=S.keptIds.size>0?`再検索（キープ${S.keptIds.size}件を残す）↗`:`${S.person}さんの候補を生成 ↗`;
  }
}

function updateOrderBtn(){const btn=document.getElementById('record-btn');if(btn){btn.disabled=!S.orderCompany;btn.style.opacity=S.orderCompany?'1':'0.35';}}

async function sendOrder(){
  const g=S.pickedGift;
  if(!S.orderCompany)return;
  const btn=document.getElementById('record-btn');
  if(btn){btn.disabled=true;btn.textContent='記録中...';}
  const today=new Date();
  const dateStr=(today.getMonth()+1)+'/'+today.getDate();
  const purposeStr=S.purposes.join('・');
  S.historyData.unshift({
    company:S.orderCompany,
    date:S.date?S.date.slice(5).replace('-','/'):dateStr,
    rawDate:S.date||today.toISOString(),
    name:g.name, shop:g.shop, loc:g.loc,
    detail:g.shop+'｜'+(g.detail||'')+'｜¥'+(g.price?g.price.toLocaleString():'要確認'),
    person:S.person, purpose:purposeStr, delivery:S.delivery,
  });
  try {
    const row=[S.orderCompany,g.name,S.orderQty,g.shop,g.detail||'',g.price||'',
      S.person+'（'+S.dept+'）',purposeStr,S.date||'',
      S.delivery?'配送':'持参',S.deliveryTo||'',new Date().toLocaleDateString('ja-JP')];
    await fetch(SHEETS_URL+'?action=addHistory&data='+encodeURIComponent(JSON.stringify(row)),{redirect:'follow'});
  } catch(e){console.log('履歴書き込みエラー:',e);}
  S.orderSent=true; renderOrderSheet(); renderHistoryFilters();
}

// ===== 店舗から選ぶ =====
function getUniqueStores(){const map={};S.gifts.forEach(g=>{if(g.shop&&!map[g.shop])map[g.shop]={name:g.shop,loc:g.loc,count:0};if(g.shop)map[g.shop].count++;});return Object.values(map);}
function matchStore(store,query){if(!query)return false;const q=query.toLowerCase();if(store.name.toLowerCase().includes(q))return true;return(STORE_READINGS[store.name]||[]).some(r=>r.toLowerCase().includes(q));}
function onStoreSearchInput(val){
  const wrap=document.getElementById('store-suggestions-wrap');
  const list=document.getElementById('store-suggestions-list');
  const noRes=document.getElementById('store-no-result');
  if(!val.trim()){wrap.style.display='none';noRes.style.display='none';return;}
  const matched=getUniqueStores().filter(s=>matchStore(s,val));
  if(!matched.length){wrap.style.display='none';noRes.style.display='block';return;}
  noRes.style.display='none';wrap.style.display='block';
  list.innerHTML=matched.map(s=>`<div class="store-suggestion-item" onclick="selectStore(${JSON.stringify(s).replace(/"/g,'&quot;')})"><span class="store-suggestion-name">${s.name}</span><span class="store-suggestion-loc">${s.loc}｜商品${s.count}点</span></div>`).join('');
}
function selectStore(store){
  S.selectedStore=store;
  document.getElementById('store-step1').style.display='none';
  document.getElementById('store-step2').style.display='block';
  document.getElementById('store-step3').style.display='none';
  const locUrl=isUrl(store.loc)?store.loc:'https://maps.google.com/?q='+encodeURIComponent(store.loc+' '+store.name);
  document.getElementById('store-selected-badge-wrap').innerHTML=`<div class="store-selected-badge"><div><div class="store-selected-name">${store.name}</div><a href="${locUrl}" target="_blank" style="color:rgba(255,255,255,0.7);font-size:11px;text-decoration:underline">${store.loc} ↗</a></div><button class="store-clear-btn" onclick="resetStoreFlow()">×</button></div>`;
  const products=S.gifts.filter(g=>g.shop===store.name);
  document.getElementById('store-products-header').textContent=`商品一覧 ${products.length}点（タップして選択）`;
  document.getElementById('store-products-list').innerHTML=products.map(g=>`<div class="gift-card" onclick="selectStoreProduct(${JSON.stringify(g).replace(/"/g,'&quot;')})"><div class="gift-img-wrap">${g.photo1?`<img src="${g.photo1}" onerror="this.parentNode.innerHTML='写真なし'">` :'写真なし'}</div><div class="gift-body"><div class="gift-name">${g.name}</div><div class="gift-foot"><span class="gift-price">${g.price?'¥'+g.price.toLocaleString():'要確認'}</span><div class="badges"><span class="badge">${g.cat}</span>${g.cold?'<span class="badge badge-warn">要冷蔵</span>':''}${g.season?`<span class="badge badge-season">${g.season}</span>`:''}</div></div><div class="gift-reason">${g.detail||''}</div></div></div>`).join('');
}
function selectStoreProduct(g){
  S.selectedStoreProduct=g;S.storeQty=1;
  document.getElementById('store-step2').style.display='none';
  document.getElementById('store-step3').style.display='block';
  document.getElementById('store-qty-display').textContent=1;
  document.getElementById('store-order-selected-product').innerHTML=`<div style="background:#f2f2f7;border-radius:12px;padding:12px 14px;font-size:13px;color:#8e8e93;line-height:2">商品：<span style="color:#1c1c1e;font-weight:700">${g.name}</span><br>店舗：<span style="color:#1c1c1e;font-weight:600">${g.shop}</span><br>価格：<span style="color:#1c1c1e;font-weight:600">${g.price?'¥'+g.price.toLocaleString():'要確認'}</span></div>`;
  document.getElementById('store-order-company').value='';
  S.storeOrderCompany='';S.storePurposes=[];
  renderStorePurposeChips();updateStoreOrderBtn();
}
function backToProducts(){document.getElementById('store-step3').style.display='none';document.getElementById('store-step2').style.display='block';}
function resetStoreFlow(){
  S.selectedStore=null;S.selectedStoreProduct=null;
  document.getElementById('store-search-input').value='';
  document.getElementById('store-suggestions-wrap').style.display='none';
  document.getElementById('store-no-result').style.display='none';
  document.getElementById('store-step1').style.display='block';
  document.getElementById('store-step2').style.display='none';
  document.getElementById('store-step3').style.display='none';
}
function renderStoreDeptTabs(){document.getElementById('store-dept-tabs').innerHTML=Object.keys(DEPTS).map(d=>`<div class="tab ${S.storeDept===d?'on':''}" onclick="selectStoreDept('${d}')">${d}</div>`).join('');}
function selectStoreDept(d){S.storeDept=d;S.storePerson=null;renderStoreDeptTabs();renderStoreMemberChips();updateStoreOrderBtn();}
function renderStoreMemberChips(){document.getElementById('store-member-chips').innerHTML=DEPTS[S.storeDept].map(m=>`<div class="chip ${S.storePerson===m?'on':''}" onclick="selectStoreMember('${m}')">${m}</div>`).join('');}
function selectStoreMember(m){S.storePerson=m;renderStoreMemberChips();updateStoreOrderBtn();}
function renderStorePurposeChips(){
  document.getElementById('store-purpose-chips').innerHTML=PURPOSES.map(v=>
    `<div class="chip ${S.storePurposes.includes(v)?'on':''}" onclick="toggleStorePurpose('${v}')">${v}</div>`
  ).join('');
}
function toggleStorePurpose(v){
  if(S.storePurposes.includes(v))S.storePurposes=S.storePurposes.filter(p=>p!==v);
  else S.storePurposes.push(v);
  renderStorePurposeChips();updateStoreOrderBtn();
}
function renderStoreDeliveryChips(){document.getElementById('store-delivery-chips').innerHTML=['持参','配送'].map(v=>{const on=(v==='配送'&&S.storeDelivery)||(v==='持参'&&!S.storeDelivery);return`<div class="chip ${on?'on':''}" onclick="selectStoreDelivery('${v}')">${v}</div>`;}).join('');document.getElementById('store-delivery-box').style.display=S.storeDelivery?'block':'none';}
function selectStoreDelivery(v){S.storeDelivery=(v==='配送');renderStoreDeliveryChips();if(S.storeDelivery){document.getElementById('store-delivery-to-chips').innerHTML=['先方オフィス','ホテル','自宅'].map(t=>`<div class="chip ${S.storeDeliveryTo===t?'on':''}" onclick="selectStoreDeliveryTo('${t}')">${t}</div>`).join('');}}
function selectStoreDeliveryTo(v){S.storeDeliveryTo=v;document.getElementById('store-delivery-to-chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.textContent===v));}
function setStoreDate(v){S.storeDate=v;document.getElementById('store-date-clear-wrap').style.display=v?'block':'none';}
function clearStoreDate(){S.storeDate='';document.getElementById('store-date-input').value='';document.getElementById('store-date-clear-wrap').style.display='none';}
function changeStoreQty(d){S.storeQty=Math.max(1,S.storeQty+d);document.getElementById('store-qty-display').textContent=S.storeQty;}
function updateStoreOrderBtn(){const btn=document.getElementById('store-order-btn');if(!btn)return;const ok=S.storePerson&&S.storeOrderCompany&&S.storePurposes.length>0;btn.disabled=!ok;btn.style.opacity=ok?'1':'0.3';}
function updateStoreCompanyList(){const el=document.getElementById('store-company-suggestions');const wrap=document.getElementById('store-company-suggestions-wrap');if(!el||!wrap)return;const q=S.storeOrderCompany.trim();if(!q){wrap.style.display='none';el.innerHTML='';return;}const past=[...new Set(S.historyData.map(h=>h.company))].filter(Boolean);const filtered=past.filter(c=>c.includes(q));if(!filtered.length){wrap.style.display='none';el.innerHTML='';return;}wrap.style.display='block';el.innerHTML=filtered.map(c=>`<div style="font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid #e5e5ea;cursor:pointer;background:#fff" onclick="selectStoreCompany('${c}')">${c}</div>`).join('');}
function selectStoreCompany(c){S.storeOrderCompany=c;document.getElementById('store-order-company').value=c;document.getElementById('store-company-suggestions-wrap').style.display='none';updateStoreOrderBtn();}

async function sendStoreOrder(){
  const g=S.selectedStoreProduct;
  if(!g||!S.storePerson||!S.storeOrderCompany)return;
  const btn=document.getElementById('store-order-btn');
  btn.disabled=true;btn.textContent='記録中...';
  const today=new Date();
  const dateStr=(today.getMonth()+1)+'/'+today.getDate();
  const purposeStr=S.storePurposes.join('・');
  S.historyData.unshift({
    company:S.storeOrderCompany,
    date:S.storeDate?S.storeDate.slice(5).replace('-','/'):dateStr,
    rawDate:S.storeDate||today.toISOString(),
    name:g.name,shop:g.shop,loc:g.loc,
    detail:g.shop+'｜'+(g.detail||'')+'｜¥'+(g.price?g.price.toLocaleString():'要確認'),
    person:S.storePerson+'（'+S.storeDept+'）',
    purpose:purposeStr,delivery:S.storeDelivery,
  });
  try {
    const row=[S.storeOrderCompany,g.name,S.storeQty,g.shop,g.detail||'',g.price||'',
      S.storePerson+'（'+S.storeDept+'）',purposeStr,S.storeDate||'',
      S.storeDelivery?'配送':'持参',S.storeDeliveryTo||'',new Date().toLocaleDateString('ja-JP')];
    await fetch(SHEETS_URL+'?action=addHistory&data='+encodeURIComponent(JSON.stringify(row)),{redirect:'follow'});
  } catch(e){console.log('記録エラー:',e);}
  document.getElementById('store-order-result').innerHTML=`<div class="sent-wrap"><div class="sent-icon">✓</div><div style="font-size:17px;font-weight:700;margin-bottom:8px">発注・記録完了</div><div style="font-size:13px;color:#8e8e93;line-height:1.7">グループLINEに通知しました。</div><button class="go-btn" style="margin-top:20px" onclick="resetMode()">トップに戻る</button></div>`;
  btn.style.display='none';renderHistoryFilters();
}

// ===== 履歴（詳細検索強化・時系列） =====
function renderHistoryFilters(){
  const companies=['すべて',...new Set(S.historyData.map(h=>h.company))];
  document.getElementById('history-filters').innerHTML=companies.map(c=>`<div class="filter-chip ${S.hFilter===c?'on':''}" onclick="selectHFilter('${c}')">${c}</div>`).join('');
}
function selectHFilter(c){S.hFilter=c;renderHistoryFilters();renderHistory();}
function renderHistory(){
  const q=(document.getElementById('history-search')?.value||'').trim();
  let filtered=S.historyData;
  // 詳細検索：社名・支店名含む全フィールド対象
  if(q) filtered=filtered.filter(h=>
    h.company.includes(q)||h.name.includes(q)||h.person.includes(q)||
    h.shop.includes(q)||h.purpose.includes(q)||h.detail.includes(q)
  );
  if(S.hFilter!=='すべて') filtered=filtered.filter(h=>h.company===S.hFilter);
  const el=document.getElementById('history-content');
  if(!filtered.length){el.innerHTML='<div class="no-result">該当する履歴がありません</div>';return;}
  el.innerHTML=filtered.map(h=>{
    const locUrl=h.loc?(isUrl(h.loc)?h.loc:'https://maps.google.com/?q='+encodeURIComponent(h.loc+' '+h.shop)):null;
    const shopLine=h.shop?(locUrl?`<span class="h-shop-link" onclick="window.open('${locUrl}','_blank')">${h.shop} ↗</span>`:`<span style="font-size:11px;color:#8e8e93">${h.shop}</span>`):'';
    return`<div class="h-item">
      <div class="h-date">${h.date}</div>
      <div class="h-body">
        <div class="h-name">${h.name}</div>
        <div style="margin-bottom:2px">${shopLine}</div>
        <div class="h-detail">${h.company}｜¥${h.detail.split('¥')[1]||''}</div>
        <div class="h-footer">
          <span class="h-person">${h.person}</span>
          <div class="badges">
            <span class="badge ${h.purpose.includes('謝罪')?'badge-warn':''}">${h.purpose}</span>
            ${h.delivery?'<span class="badge">配送</span>':''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}
</script>
