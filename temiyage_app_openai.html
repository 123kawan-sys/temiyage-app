<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="手土産アプリ">
<link rel="apple-touch-icon" href="apple-touch-icon.png.webp">
<title>手土産アプリ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f5f5f7; color: #1c1c1e; max-width: 480px; margin: 0 auto; min-height: 100vh; }
.nav { display: flex; background: #fff; border-bottom: 1px solid #e5e5ea; position: sticky; top: 0; z-index: 100; }
.nav-btn { flex: 1; padding: 12px 4px 10px; font-size: 11px; font-weight: 600; border: none; background: none; color: #8e8e93; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.nav-btn.active { color: #1c1c1e; border-bottom-color: #1c1c1e; }
.page { display: none; padding: 16px; }
.page.active { display: block; }
.section { margin-bottom: 18px; }
.lbl { font-size: 11px; font-weight: 600; color: #8e8e93; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { font-size: 13px; padding: 6px 13px; border-radius: 20px; border: 1px solid #d1d1d6; color: #8e8e93; background: #fff; cursor: pointer; transition: all 0.12s; user-select: none; }
.chip.on { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
.tab-row { display: flex; gap: 6px; margin-bottom: 10px; }
.tab { font-size: 13px; font-weight: 600; padding: 6px 18px; border-radius: 20px; border: 1px solid #d1d1d6; color: #8e8e93; cursor: pointer; }
.tab.on { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
input[type=text], input[type=date], input[type=number], select, textarea { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d1d6; background: #fff; color: #1c1c1e; -webkit-appearance: none; appearance: none; }
.delivery-box { background: #f2f2f7; border-radius: 12px; padding: 12px; margin-top: 8px; }
.go-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 14px; border: none; background: #1c1c1e; color: #fff; cursor: pointer; margin-top: 4px; transition: opacity 0.15s; }
.go-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.divider { border: none; border-top: 1px solid #e5e5ea; margin: 6px 0 16px; }
.loading { text-align: center; padding: 40px 20px; color: #8e8e93; font-size: 14px; }
.spinner { width: 28px; height: 28px; border: 2px solid #e5e5ea; border-top-color: #1c1c1e; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: #fff0f0; border-radius: 12px; padding: 14px; text-align: center; font-size: 13px; color: #c0392b; }
.result-header { font-size: 13px; font-weight: 600; color: #8e8e93; margin-bottom: 12px; }
.gift-card { background: #fff; border-radius: 16px; border: 1px solid #e5e5ea; overflow: hidden; margin-bottom: 12px; cursor: pointer; transition: transform 0.1s; }
.gift-card:active { transform: scale(0.98); }
.gift-img-wrap { width: 100%; height: 140px; background: #f2f2f7; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8e8e93; overflow: hidden; }
.gift-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.gift-body { padding: 12px 14px; }
.gift-name { font-size: 14px; font-weight: 700; color: #1c1c1e; margin-bottom: 3px; }
.gift-shop { font-size: 12px; color: #8e8e93; margin-bottom: 6px; }
.gift-foot { display: flex; justify-content: space-between; align-items: center; }
.gift-price { font-size: 15px; font-weight: 700; color: #1c1c1e; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #e8f4fd; color: #1a73e8; }
.badge-warn { background: #fff3cd; color: #856404; }
.badge-danger { background: #fde8e8; color: #c0392b; }
.badge-season { background: #e8f5e9; color: #2e7d32; }
.gift-reason { font-size: 12px; color: #8e8e93; margin-top: 6px; line-height: 1.5; }
.expiry-alert { font-size: 11px; color: #c0392b; margin-top: 4px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 16px; }
.modal-handle { width: 36px; height: 4px; background: #d1d1d6; border-radius: 2px; margin: 0 auto 14px; }
.modal-img-wrap { width: 100%; height: 180px; background: #f2f2f7; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8e8e93; overflow: hidden; margin-bottom: 14px; }
.modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.modal-name { font-size: 18px; font-weight: 700; color: #1c1c1e; margin-bottom: 2px; }
.modal-shop { font-size: 13px; color: #8e8e93; margin-bottom: 12px; }
.modal-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f2f7; font-size: 13px; }
.modal-lbl { color: #8e8e93; }
.modal-val { color: #1c1c1e; font-weight: 600; text-align: right; max-width: 60%; line-height: 1.5; }
.modal-val.warn { color: #856404; }
.modal-val.danger { color: #c0392b; }
.order-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 14px; border: none; background: #1c1c1e; color: #fff; cursor: pointer; margin-top: 14px; }
.modal-close { width: 100%; padding: 12px; font-size: 14px; border-radius: 14px; border: 1px solid #d1d1d6; background: none; color: #8e8e93; cursor: pointer; margin-top: 8px; }
.order-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-end; justify-content: center; }
.order-overlay.open { display: flex; }
.order-sheet { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 16px; }
.order-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.order-sub { font-size: 13px; color: #8e8e93; margin-bottom: 14px; }
.order-summary { background: #f2f2f7; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: #8e8e93; line-height: 2.1; }
.order-summary span { color: #1c1c1e; font-weight: 600; }
.send-execute { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 14px; border: none; background: #1c1c1e; color: #fff; cursor: pointer; }
.sent-wrap { text-align: center; padding: 30px 16px; }
.sent-icon { width: 56px; height: 56px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 26px; }
.search-box-wrap { position: relative; margin-bottom: 10px; }
.search-box { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 12px; border: 1px solid #d1d1d6; background: #f2f2f7; color: #1c1c1e; }
.filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; flex-wrap: nowrap; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #d1d1d6; color: #8e8e93; background: #fff; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.filter-chip.on { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
.h-item { display: flex; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #f2f2f7; }
.h-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.h-date { font-size: 11px; color: #8e8e93; min-width: 40px; padding-top: 2px; }
.h-body { flex: 1; }
.h-name { font-size: 13px; font-weight: 700; color: #1c1c1e; margin-bottom: 2px; }
.h-detail { font-size: 11px; color: #8e8e93; line-height: 1.5; margin-bottom: 3px; }
.h-shop-link { font-size: 11px; color: #1a73e8; text-decoration: underline; cursor: pointer; display: inline-block; margin-bottom: 3px; }
.h-footer { display: flex; justify-content: space-between; align-items: center; }
.h-person { font-size: 11px; color: #8e8e93; }
.no-result { text-align: center; padding: 40px 0; font-size: 14px; color: #8e8e93; }
.qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qty-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #d1d1d6; background: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.qty-num { font-size: 20px; font-weight: 700; min-width: 32px; text-align: center; }

/* ── モード選択 ── */
.mode-select-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
.mode-btn { flex: 1; padding: 20px 10px 16px; border-radius: 18px; border: 1.5px solid #e5e5ea; background: #fff; cursor: pointer; text-align: center; transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.mode-btn:active { transform: scale(0.97); }
.mode-btn .mode-label { font-size: 14px; font-weight: 700; color: #1c1c1e; margin-top: 10px; line-height: 1.5; }
.mode-btn .mode-desc { font-size: 11px; color: #8e8e93; margin-top: 4px; line-height: 1.6; }

/* ── お店から選ぶ ── */
.store-search-input { width: 100%; font-size: 15px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #d1d1d6; background: #fff; color: #1c1c1e; outline: none; -webkit-appearance: none; }
.store-search-input:focus { border-color: #1c1c1e; }
.store-suggestions { background: #fff; border-radius: 12px; border: 1px solid #e5e5ea; overflow: hidden; margin-top: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.store-suggestion-item { padding: 12px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f2f2f7; display: flex; flex-direction: column; gap: 2px; }
.store-suggestion-item:last-child { border-bottom: none; }
.store-suggestion-item:active { background: #f2f2f7; }
.store-suggestion-name { font-weight: 600; color: #1c1c1e; }
.store-suggestion-loc { font-size: 11px; color: #8e8e93; }
.store-selected-badge { display: flex; align-items: center; justify-content: space-between; background: #1c1c1e; color: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.store-selected-name { font-size: 14px; font-weight: 700; }
.store-selected-loc { font-size: 11px; opacity: 0.7; margin-top: 2px; }
.store-clear-btn { font-size: 20px; opacity: 0.6; cursor: pointer; background: none; border: none; color: #fff; padding: 0 0 0 10px; }
.store-products-header { font-size: 13px; font-weight: 600; color: #8e8e93; margin-bottom: 10px; }
.back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8e8e93; cursor: pointer; margin-bottom: 14px; border: none; background: none; padding: 0; }
.order-form-section { margin-bottom: 14px; }
.order-form-label { font-size: 11px; font-weight: 600; color: #8e8e93; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
</style>
</head>
<body>

<div style="background:#1c1c1e;padding:12px 16px 10px;text-align:center">
  <span style="color:#fff;font-size:16px;font-weight:700;letter-spacing:0.05em">手土産アプリ</span>
</div>
<div class="nav">
  <button class="nav-btn active" onclick="showPage('search')">候補検索</button>
  <button class="nav-btn" onclick="showPage('history')">履歴</button>
</div>

<div id="page-search" class="page active">

  <!-- モード選択 -->
  <div id="mode-select-area">
    <div style="font-size:13px;color:#8e8e93;margin-bottom:12px;text-align:center">どちらで探しますか？</div>
    <div class="mode-select-wrap">

      <!-- AIボタン -->
      <div class="mode-btn" onclick="selectMode('ai')">
        <img src="icon_ai.png" style="width:80px;height:80px;object-fit:contain;display:block;margin:0 auto">
        <div class="mode-label">AIにおすすめ<br>を聞く</div>
        <div class="mode-desc">条件を入力して<br>AIが最適候補を提案</div>
      </div>

      <!-- お店ボタン -->
      <div class="mode-btn" onclick="selectMode('store')">
        <img src="icon_store.png" style="width:80px;height:80px;object-fit:contain;display:block;margin:0 auto">
        <div class="mode-label">お店から<br>選ぶ</div>
        <div class="mode-desc">店舗を選んで<br>商品を指定</div>
      </div>

    </div>
  </div>

  <!-- AI検索フォーム -->
  <div id="ai-search-area" style="display:none">
    <button class="back-btn" onclick="resetMode()">← 選び直す</button>
    <div class="section">
      <div class="lbl">発注者</div>
      <div class="tab-row" id="dept-tabs"></div>
      <div class="chips" id="member-chips"></div>
    </div>
    <hr class="divider">
    <div class="section">
      <div class="lbl">訪問目的</div>
      <div class="chips" id="purpose-chips"></div>
    </div>
    <div class="section">
      <div class="lbl">相手の役職</div>
      <div class="chips" id="role-chips"></div>
    </div>
    <div class="section">
      <div class="lbl">相手の所在地</div>
      <div class="chips" id="region-chips"></div>
    </div>
    <hr class="divider">
    <div class="section">
      <div class="lbl">渡す日</div>
      <div style="position:relative;display:inline-block;width:100%">
        <div id="date-btn" onclick="document.getElementById('date-input').focus()"
          style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;border:1px solid #d1d1d6;background:#fff;cursor:pointer">
          <span id="date-display-text" style="font-size:14px;color:#8e8e93">タップして日付を選ぶ</span>
          <span id="date-clear" style="display:none;font-size:18px;color:#8e8e93" onclick="event.stopPropagation();clearDate()">×</span>
        </div>
        <input type="date" id="date-input" onchange="setDate(this.value)"
          style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1">
      </div>
    </div>
    <div class="section">
      <div class="lbl">予算レンジ</div>
      <div class="chips" id="budget-chips"></div>
    </div>
    <div class="section">
      <div class="lbl">持参 or 配送</div>
      <div class="chips" id="delivery-chips"></div>
      <div id="delivery-box" style="display:none">
        <div class="delivery-box">
          <div class="lbl">送り先</div>
          <div class="chips" id="delivery-to-chips"></div>
          <input type="text" id="delivery-addr" placeholder="住所を入力（任意）" style="margin-top:8px">
        </div>
      </div>
    </div>
    <button class="go-btn" id="go-btn" disabled onclick="generateCandidates()">条件をすべて選んでください</button>
    <div id="result-area" style="margin-top:20px"></div>
  </div>

  <!-- お店から選ぶフロー -->
  <div id="store-search-area" style="display:none">
    <button class="back-btn" onclick="resetMode()">← 選び直す</button>
    <div id="store-step1">
      <div class="section">
        <div class="lbl">店舗名を入力</div>
        <input type="text" class="store-search-input" id="store-search-input"
          placeholder="店名をひらがな・カタカナ・英字で…"
          oninput="onStoreSearchInput(this.value)"
          autocomplete="off">
        <div id="store-suggestions-wrap" style="display:none;margin-top:4px">
          <div class="store-suggestions" id="store-suggestions-list"></div>
        </div>
        <div id="store-no-result" style="display:none;font-size:13px;color:#8e8e93;padding:10px 0">該当する店舗が見つかりません</div>
      </div>
    </div>
    <div id="store-step2" style="display:none">
      <div id="store-selected-badge-wrap"></div>
      <div class="store-products-header" id="store-products-header"></div>
      <div id="store-products-list"></div>
    </div>
    <div id="store-step3" style="display:none">
      <button class="back-btn" onclick="backToProducts()">← 商品を選び直す</button>
      <div id="store-order-selected-product" style="margin-bottom:14px"></div>
      <div class="order-form-section">
        <div class="order-form-label">発注者</div>
        <div class="tab-row" id="store-dept-tabs"></div>
        <div class="chips" id="store-member-chips"></div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">お渡し先の会社名</div>
        <input type="text" id="store-order-company" placeholder="例：丸紅不動産"
          oninput="S.storeOrderCompany=this.value;updateStoreOrderBtn();updateStoreCompanyList()"
          style="margin-bottom:6px">
        <div id="store-company-suggestions-wrap" style="display:none;margin-bottom:8px">
          <div style="display:flex;flex-direction:column;gap:3px" id="store-company-suggestions"></div>
        </div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">訪問目的</div>
        <div class="chips" id="store-purpose-chips"></div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">渡す日</div>
        <div style="position:relative;display:inline-block;width:100%">
          <div onclick="document.getElementById('store-date-input').focus()"
            style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;border:1px solid #d1d1d6;background:#fff;cursor:pointer">
            <span id="store-date-display" style="font-size:14px;color:#8e8e93">タップして日付を選ぶ</span>
            <span id="store-date-clear" style="display:none;font-size:18px;color:#8e8e93" onclick="event.stopPropagation();clearStoreDate()">×</span>
          </div>
          <input type="date" id="store-date-input" onchange="setStoreDate(this.value)"
            style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1">
        </div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">個数</div>
        <div class="qty-row">
          <button class="qty-btn" onclick="changeStoreQty(-1)">−</button>
          <span class="qty-num" id="store-qty-display">1</span>
          <button class="qty-btn" onclick="changeStoreQty(1)">＋</button>
          <span style="font-size:13px;color:#8e8e93">個</span>
        </div>
      </div>
      <div class="order-form-section">
        <div class="order-form-label">持参 or 配送</div>
        <div class="chips" id="store-delivery-chips"></div>
        <div id="store-delivery-box" style="display:none">
          <div class="delivery-box">
            <div class="lbl">送り先</div>
            <div class="chips" id="store-delivery-to-chips"></div>
          </div>
        </div>
      </div>
      <button class="go-btn" id="store-order-btn" disabled onclick="sendStoreOrder()" style="margin-top:8px">発注し履歴に記録する ↗</button>
      <div id="store-order-result" style="margin-top:16px"></div>
    </div>
  </div>
</div>

<div id="page-history" class="page">
  <div class="search-box-wrap">
    <input type="text" class="search-box" id="history-search" placeholder="🔍 社名・商品名・担当者で検索" oninput="renderHistory()">
  </div>
  <div class="filter-row" id="history-filters"></div>
  <div id="history-content"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>
<div class="order-overlay" id="order-overlay" onclick="closeOrder(event)">
  <div class="order-sheet" id="order-content"></div>
</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxcEXLzjVzCymWNmBHxSsDPHBeloFqVpZMeQQwKe69YeBO5mkWiB4Mata5p_ppHvaZofQ/exec';
const DEPTS = {
  'BR': ['社長','久積','河埜','宮原','廣野','佐藤','牧田','窪田','久保'],
  'PM': ['小島','森崎','中村聖','鳥海','矢島','奥村','宮園','下田','栗林','村田','空閑','中村美','萩原','西山','池田','藤田'],
};
const STORE_READINGS = {
  'ASAKOIWAYANAGI': ['あさこいわやなぎ','アサコイワヤナギ','asako'],
  'DIVA': ['でぃーば','ディーバ','diva'],
  '季のせ': ['きのせ','キノセ','kinose'],
  'オーフィルドゥジュ': ['おーふぃるどぅじゅ','オーフィルドゥジュ','aufildujeu'],
  'エノテカ/岩田屋': ['えのてか','エノテカ','enoteca','いわたや'],
  'ふくや': ['ふくや','フクヤ','fukuya'],
  'フルフル': ['ふるふる','フルフル'],

async function loadGiftsFromSheets() {
  try {
    const res = await fetch(SHEETS_URL, { redirect: 'follow' });
    const data = await res.json();
    try {
      const hres = await fetch(SHEETS_URL + '?sheet=履歴', { redirect: 'follow' });
      const hdata = await hres.json();
      if (Array.isArray(hdata)) {
        S.historyData = hdata.map(r => ({
          company: r['お渡し先'] || '',
          date: formatDate(r['日付'] || r['渡す日']),
          rawDate: r['日付'] || r['渡す日'] || '',
          name: r['商品名'] || '',
          shop: r['店舗名'] || '',
          loc: r['購入場所'] || '',
          detail: (r['店舗名']||'') + '｜' + (r['内容']||'') + '｜¥' + (r['価格']||''),
          person: r['発注者'] || '',
          purpose: r['目的'] || '',
          delivery: r['持参配送'] === '配送',
        })).filter(r => r.company);
        S.historyData.sort((a,b) => new Date(b.rawDate||0) - new Date(a.rawDate||0));
      }
    } catch(e2) {}
    if (Array.isArray(data) && data.length > 0) {
      S.gifts = data.map((row,i) => ({
        id: row['ID'] || i+1,
        name: row['商品名'] || '',
        shop: row['店舗名'] || '',
        loc: row['購入場所'] || '',
        cat: row['カテゴリ'] || '',
        price: row['価格（税込）'] ? Number(row['価格（税込）']) : null,
        detail: row['内容・個数'] || '',
        purpose: row['訪問目的'] ? row['訪問目的'].split(',').map(s=>s.trim()) : [],
        note: row['備考'] || '',
        cold: row['要冷蔵']==='〇'||row['要冷蔵']==='要冷蔵',
        season: row['季節限定'] || null,
        expiry: row['賞味期限（日数）'] ? Number(row['賞味期限（日数）']) : null,
        photo1: row['写真URL'] || null,
      })).filter(g => g.name);
    }
  } catch(e) { console.log('シート読み込みエラー:', e); }
}

function formatDate(d) {
  if (!d) return '';
  if (d instanceof Date) return (d.getMonth()+1)+'/'+d.getDate();
  var s = String(d);
  if (s.includes('T')) { var dt=new Date(s); return (dt.getMonth()+1)+'/'+dt.getDate(); }
  return s;
}
function isUrl(s) { return s && (s.startsWith('http://')||s.startsWith('https://')); }

function getUniqueStores() {
  const map = {};
  S.gifts.forEach(g => {
    if (g.shop && !map[g.shop]) map[g.shop] = { name:g.shop, loc:g.loc, count:0 };
    if (g.shop) map[g.shop].count++;
  });
  return Object.values(map);
}
function matchStore(store, query) {
  if (!query) return false;
  const q = query.toLowerCase();
  if (store.name.toLowerCase().includes(q)) return true;
  return (STORE_READINGS[store.name]||[]).some(r=>r.toLowerCase().includes(q));
}
function onStoreSearchInput(val) {
  const wrap = document.getElementById('store-suggestions-wrap');
  const list = document.getElementById('store-suggestions-list');
  const noRes = document.getElementById('store-no-result');
  if (!val.trim()) { wrap.style.display='none'; noRes.style.display='none'; return; }
  const matched = getUniqueStores().filter(s=>matchStore(s,val));
  if (!matched.length) { wrap.style.display='none'; noRes.style.display='block'; return; }
  noRes.style.display='none'; wrap.style.display='block';
  list.innerHTML = matched.map(s =>
    `<div class="store-suggestion-item" onclick="selectStore(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      <span class="store-suggestion-name">${s.name}</span>
      <span class="store-suggestion-loc">${s.loc}｜商品${s.count}点</span>
    </div>`).join('');
}

function closeModalDirect(){document.getElementById('modal-overlay').classList.remove('open');}
function showOrder(){S.orderSent=false;S.orderQty=1;renderOrderSheet();document.getElementById('order-overlay').classList.add('open');}
function closeOrder(e){if(e.target===document.getElementById('order-overlay'))document.getElementById('order-overlay').classList.remove('open');}
function changeQty(delta){S.orderQty=Math.max(1,S.orderQty+delta);const el=document.getElementById('qty-display');if(el)el.textContent=S.orderQty;const sq=document.getElementById('summary-qty');if(sq)sq.textContent=S.orderQty+'個';}
function renderOrderSheet(){const g=S.pickedGift;if(S.orderSent){document.getElementById('order-content').innerHTML=`<div class="modal-handle"></div><div class="sent-wrap"><div class="sent-icon">✓</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">発注・履歴記録完了</div><div style="font-size:14px;color:#8e8e93;line-height:1.7">グループLINEに通知しました。</div><button class="send-execute" style="margin-top:24px" onclick="document.getElementById('order-overlay').classList.remove('open');document.getElementById('modal-overlay').classList.remove('open')">閉じる</button></div>`;return;}document.getElementById('order-content').innerHTML=`<div class="modal-handle"></div><div class="order-title">手土産発注・履歴記録</div><div class="order-sub">お渡し先を入力して記録してください</div><div class="lbl" style="margin-bottom:6px">お渡し先の会社名</div><input type="text" id="order-company" placeholder="例：丸紅不動産" value="${S.orderCompany||''}" oninput="S.orderCompany=this.value;updateOrderBtn();updateCompanyList()" style="margin-bottom:6px"><div id="company-suggestions-wrap" style="display:none;margin-bottom:12px"><div style="display:flex;flex-direction:column;gap:3px" id="company-suggestions"></div></div><div class="lbl" style="margin-bottom:8px">発注個数</div><div class="qty-row"><button class="qty-btn" onclick="changeQty(-1)">−</button><span class="qty-num" id="qty-display">${S.orderQty}</span><button class="qty-btn" onclick="changeQty(1)">＋</button><span style="font-size:13px;color:#8e8e93">個</span></div><div class="order-summary">商品：<span>${g.name}</span><br>店舗：<span>${g.shop}（${g.loc}）</span><br>価格：<span>¥${g.price?g.price.toLocaleString():'要確認'}</span><br>個数：<span id="summary-qty">${S.orderQty}個</span><br>発注者：<span>${S.person}（${S.dept}）</span><br>目的：<span>${S.purpose}</span><br>渡す日：<span>${S.date||'未定'}</span><br>${S.delivery?`配送先：<span>${S.deliveryTo||'—'}</span>`:'持参'}</div><button class="send-execute" id="record-btn" onclick="sendOrder()" ${!S.orderCompany?'disabled style="opacity:0.35"':''}>発注し履歴に記録する ↗</button><button style="margin-top:8px;width:100%;padding:12px;font-size:14px;border-radius:14px;border:1px solid #d1d1d6;background:none;color:#8e8e93;cursor:pointer" onclick="document.getElementById('order-overlay').classList.remove('open')">戻る</button>`;}
function selectCompany(c){S.orderCompany=c;const inp=document.getElementById('order-company');if(inp)inp.value=c;const wrap=document.getElementById('company-suggestions-wrap');if(wrap)wrap.style.display='none';updateOrderBtn();}
function updateCompanyList(){const el=document.getElementById('company-suggestions');const wrap=document.getElementById('company-suggestions-wrap');if(!el||!wrap)return;const q=S.orderCompany.trim();if(!q){wrap.style.display='none';el.innerHTML='';return;}const past=[...new Set(S.historyData.map(h=>h.company))].filter(Boolean);const filtered=past.filter(c=>c.includes(q));if(!filtered.length){wrap.style.display='none';el.innerHTML='';return;}wrap.style.display='block';el.innerHTML=filtered.map(c=>`<div style="font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid #e5e5ea;cursor:pointer;background:#fff" onclick="selectCompany('${c}')">${c}</div>`).join('');}
function updateOrderBtn(){const btn=document.querySelector('.send-execute');if(btn){btn.disabled=!S.orderCompany;btn.style.opacity=S.orderCompany?'1':'0.35';}}
async function sendOrder(){const g=S.pickedGift;if(!S.orderCompany)return;const btn=document.getElementById('record-btn');if(btn){btn.disabled=true;btn.textContent='記録中...';}const today=new Date();const dateStr=(today.getMonth()+1)+'/'+today.getDate();S.historyData.unshift({company:S.orderCompany,date:S.date?S.date.slice(5).replace('-','/'):dateStr,rawDate:S.date||today.toISOString(),name:g.name,shop:g.shop,loc:g.loc,detail:g.shop+'｜'+(g.detail||'')+'｜¥'+(g.price?g.price.toLocaleString():'要確認'),person:S.person,purpose:S.purpose,delivery:S.delivery});try{const row=[S.orderCompany,g.name,S.orderQty,g.shop,g.detail||'',g.price||'',S.person+'（'+S.dept+'）',S.purpose,S.date||'',S.delivery?'配送':'持参',S.deliveryTo||'',new Date().toLocaleDateString('ja-JP')];await fetch(SHEETS_URL+'?action=addHistory&data='+encodeURIComponent(JSON.stringify(row)),{redirect:'follow'});}catch(e){console.log('履歴書き込みエラー:',e);}S.orderSent=true;renderOrderSheet();renderHistoryFilters();}
function renderHistoryFilters(){const companies=['すべて',...new Set(S.historyData.map(h=>h.company))];document.getElementById('history-filters').innerHTML=companies.map(c=>`<div class="filter-chip ${S.hFilter===c?'on':''}" onclick="selectHFilter('${c}')">${c}</div>`).join('');}
function selectHFilter(c){S.hFilter=c;renderHistoryFilters();renderHistory();}
function renderHistory(){
  const q=(document.getElementById('history-search')?.value||'').trim();
  let filtered=S.historyData;
  if(q)filtered=filtered.filter(h=>h.company.includes(q)||h.name.includes(q)||h.person.includes(q));
  if(S.hFilter!=='すべて')filtered=filtered.filter(h=>h.company===S.hFilter);
  const el=document.getElementById('history-content');
  if(!filtered.length){el.innerHTML='<div class="no-result">該当する履歴がありません</div>';return;}
  el.innerHTML=filtered.map(h=>{
    const locUrl=h.loc?(isUrl(h.loc)?h.loc:'https://maps.google.com/?q='+encodeURIComponent(h.loc+' '+h.shop)):null;
    const shopLine=h.shop?(locUrl?`<span class="h-shop-link" onclick="window.open('${locUrl}','_blank')">${h.shop} ↗</span>`:`<span style="font-size:11px;color:#8e8e93">${h.shop}</span>`):'';
    return`<div class="h-item">
      <div class="h-date">${h.date}</div>
      <div class="h-body">
        <div class="h-name">${h.name}</div>
        <div style="margin-bottom:2px">${shopLine}</div>
        <div class="h-detail">${h.company}｜¥${h.detail.split('¥')[1]||''}</div>
        <div class="h-footer">
          <span class="h-person">${h.person}</span>
          <div class="badges"><span class="badge ${h.purpose==='謝罪'?'badge-warn':''}">${h.purpose}</span>${h.delivery?'<span class="badge">配送</span>':''}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
